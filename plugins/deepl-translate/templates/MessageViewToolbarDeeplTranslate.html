<div class="btn-group" data-bind="visible: deeplConfigured && message()">
	<a class="btn" data-bind="visible: !deeplTranslated(), click: deeplTranslate,
			css: { 'icon-globe': !deeplBusy(), 'icon-spinner': deeplBusy() }"
		data-i18n="[title]DEEPL/TRANSLATE"></a>
	<a class="btn icon-undo" data-bind="visible: deeplTranslated, click: deeplTranslate"
		data-i18n="[title]DEEPL/SHOW_ORIGINAL"></a>
</div>
